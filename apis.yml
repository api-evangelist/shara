name: Shara
description: >-
  Shara (Shara Technology Management Nigeria Ltd) is a Lagos-based fintech that
  provides collateral-free working-capital loans of up to NGN 10 million to
  Nigerian small and medium-sized businesses. Sole traders, partnerships, and
  limited companies apply through Shara's website or Android app with basic
  business details and a bank statement, and receive a free loan estimate in
  seconds with approval typically in 48 hours to two weeks. The company reports
  over NGN 50 billion disbursed across 100,000+ loans to 7,000+ business
  customers. Shara publishes no public API, developer portal, or documentation.
